user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    gzip on;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # CHAT-pbup: framing policy emitted via Content-Security-Policy.
        # entrypoint.sh chooses the frame-ancestors list from
        # MOSES_EMBEDDING_FRAMING + MOSES_EMBEDDING_ALLOWED_ANCESTORS. The
        # legacy unconditional `X-Frame-Options: SAMEORIGIN` is gone.
        add_header Content-Security-Policy "frame-ancestors ${MOSES_CSP_FRAME_ANCESTORS}; ${MOSES_CSP_REPORT_URI}" always;
        ${MOSES_X_FRAME_OPTIONS_LINE}
        add_header X-Content-Type-Options "nosniff" always;
        # X-XSS-Protection deliberately omitted: deprecated/no-op in modern
        # browsers. Content-Security-Policy is the source of truth.

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # MOSES ROUTING MODEL:
        # Browser -> /apps/workspace/app-slug/api/... -> app ingress (strips prefix)
        #   -> this nginx -> proxy_pass to backend service
        # Frontend JS MUST use relative paths: fetch('api/...') NOT fetch('/api/...')
        # Absolute paths bypass this proxy entirely and hit the Moses platform backend.

        # API proxy to backend service
        location /api/ {
            proxy_pass http://${BACKEND_SERVICE_HOST}:${BACKEND_SERVICE_PORT}/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass through Moses headers
            proxy_pass_header X-Moses-Tenant-ID;
            proxy_pass_header X-Moses-User-ID;
            proxy_pass_header X-Moses-Chart-ID;
            proxy_pass_header X-Moses-Request-ID;
        }

        # Static assets with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # CHAT-pbup Bugs 2 + 4: when MOSES_BASE_PATH is non-root, this block
        # adds /apps/<tenant>/<slug>/api/ proxy_pass + a rewrite-then-relocate
        # for the SPA path. Empty when MOSES_BASE_PATH=/.
        ${MOSES_SUBPATH_LOCATION_BLOCK}

        # SPA routing - serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
