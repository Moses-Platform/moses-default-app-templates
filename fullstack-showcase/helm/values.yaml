moses:
  namespace: ""
  tenantId: ""
  executionId: ""
  chartId: ""
  appSlug: ""
  # CHAT-pbup: Moses-aware template values. See ../README.md / DEPRECATIONS.md.
  basePath: "/"
  embedding:
    framing: ""           # empty -> appType default (hybrid: moses-only)
    allowedAncestors: []
    reportUri: ""

# Image references (v2 format — used by deployment template)
# These are overridden by Moses during deployment via --set images.{name}.repository=...
images:
  frontend:
    repository: "fullstack-showcase-frontend"
    tag: "latest"
    pullPolicy: IfNotPresent
  backend:
    repository: "fullstack-showcase-backend"
    tag: "latest"
    pullPolicy: IfNotPresent

services:
  - name: frontend
    image:
      repository: "fullstack-showcase-frontend"
      tag: "latest"
      pullPolicy: IfNotPresent
    port: 8080
    replicas: 1
    resources:
      limits:
        cpu: "200m"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
    healthCheck:
      enabled: true
      path: /health
    ingress: true

  - name: backend
    image:
      repository: "fullstack-showcase-backend"
      tag: "latest"
      pullPolicy: IfNotPresent
    port: 8080
    replicas: 1
    resources:
      limits:
        cpu: "200m"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
    healthCheck:
      enabled: true
      path: /health

globalEnv:
  # CHAT-pbup: BASE_URL deprecated alias, MOSES_BASE_PATH canonical.
  BASE_URL: ""
  MOSES_BASE_PATH: ""
  NODE_ENV: "production"
  MOSES_EMBEDDING_FRAMING: ""
  MOSES_EMBEDDING_ALLOWED_ANCESTORS: ""
  MOSES_EMBEDDING_REPORT_URI: ""

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: showcase
    password: showcase-secret  # WARNING: Override in production via --set postgresql.auth.password=<secret>
    database: showcase
  resources:
    limits:
      cpu: "200m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
