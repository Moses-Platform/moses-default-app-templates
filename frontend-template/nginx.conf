worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # CHAT-pbup: framing policy emitted via Content-Security-Policy.
        # entrypoint.sh chooses the frame-ancestors source list from
        # MOSES_EMBEDDING_FRAMING + MOSES_EMBEDDING_ALLOWED_ANCESTORS. The
        # legacy unconditional `X-Frame-Options: SAMEORIGIN` is gone.
        add_header Content-Security-Policy "frame-ancestors ${MOSES_CSP_FRAME_ANCESTORS}; ${MOSES_CSP_REPORT_URI}" always;
        ${MOSES_X_FRAME_OPTIONS_LINE}
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Health check stays at root regardless of MOSES_BASE_PATH.
        # K8s probes bypass ingress (per moses-deployment-guide skill).
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Static assets with caching. Vite emits relative asset paths
        # (base: './'), so they work under any BASE_PATH without rewriting.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # CHAT-pbup Bug 2: when MOSES_BASE_PATH is non-root, this block
        # rewrites /apps/<tenant>/<slug>/<rest> → /<rest> via `rewrite ... last`
        # so the existing static-asset regex and SPA `location /` handler
        # serve the result. Empty when MOSES_BASE_PATH=/.
        ${MOSES_SUBPATH_LOCATION_BLOCK}

        # SPA routing - all other requests serve index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
