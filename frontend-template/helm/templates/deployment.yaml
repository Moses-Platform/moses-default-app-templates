apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-deployed-app.fullname" . }}
  labels:
    {{- include "agent-deployed-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agent-deployed-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-deployed-app.selectorLabels" . | nindent 8 }}
        moses.ai/tenant-id: {{ .Values.moses.tenantId | quote }}
        {{- if .Values.moses.chartId }}
        moses.ai/chart-id: {{ .Values.moses.chartId | quote }}
        {{- end }}
        {{- if .Values.moses.appSlug }}
        moses.ai/app-slug: {{ .Values.moses.appSlug | quote }}
        {{- end }}
        moses.ai/managed-by: moses
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- if .Values.secrets }}
          envFrom:
            {{- if .Values.secrets.secretName }}
            - secretRef:
                name: {{ .Values.secrets.secretName }}
            {{- end }}
            {{- if .Values.secrets.configMapName }}
            - configMapRef:
                name: {{ .Values.secrets.configMapName }}
            {{- end }}
          {{- end }}
          env:
            - name: PORT
              value: {{ .Values.env.PORT | default "8080" | quote }}
            - name: NODE_ENV
              value: {{ .Values.env.NODE_ENV | default "production" | quote }}
            # BASE_URL is the legacy alias; MOSES_BASE_PATH is the canonical
            # name (CHAT-pbup). Both are emitted simultaneously during the
            # N-2 deprecation window. See ../../README.md.
            - name: BASE_URL
              value: {{ .Values.env.BASE_URL | default .Values.moses.basePath | default "" | quote }}
            - name: MOSES_BASE_PATH
              value: {{ .Values.env.MOSES_BASE_PATH | default .Values.moses.basePath | default "/" | quote }}
            # CHAT-pbup: framing values consumed by nginx envsubst at startup
            # to render Content-Security-Policy: frame-ancestors. Empty values
            # resolve to the template's appType default at the entrypoint.
            - name: MOSES_EMBEDDING_FRAMING
              value: {{ .Values.env.MOSES_EMBEDDING_FRAMING | default .Values.moses.embedding.framing | default "" | quote }}
            - name: MOSES_EMBEDDING_ALLOWED_ANCESTORS
              value: {{ .Values.env.MOSES_EMBEDDING_ALLOWED_ANCESTORS | default (join " " .Values.moses.embedding.allowedAncestors) | default "" | quote }}
            - name: MOSES_EMBEDDING_REPORT_URI
              value: {{ .Values.env.MOSES_EMBEDDING_REPORT_URI | default .Values.moses.embedding.reportUri | default "" | quote }}
          {{- if .Values.startupProbe }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
