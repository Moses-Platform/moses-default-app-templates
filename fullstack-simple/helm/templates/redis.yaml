{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-deployed-app.fullname" . }}-redis
  labels:
    {{- include "agent-deployed-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agent-deployed-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "agent-deployed-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
        moses-manager.eu/tenant-id: {{ .Values.moses.tenantId | quote }}
        moses-manager.eu/execution-id: {{ .Values.moses.executionId | quote }}
        moses-manager.eu/managed-by: moses
    spec:
      automountServiceAccountToken: {{ .Values.redis.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.redis.podSecurityContext | nindent 8 }}
      containers:
        - name: redis
          securityContext:
            {{- toYaml .Values.redis.securityContext | nindent 12 }}
          image: "{{ .Values.redis.image.repository | default "valkey/valkey" }}:{{ .Values.redis.image.tag | default "8-alpine" }}"
          # Kubernetes expands this env reference without shell interpolation.
          args: ["valkey-server", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "redis.auth.existingSecret is required when redis.enabled=true (precreate a namespace Secret)" .Values.redis.auth.existingSecret | quote }}
                  key: {{ .Values.redis.auth.passwordKey | default "password" | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-deployed-app.fullname" . }}-redis
  labels:
    {{- include "agent-deployed-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "agent-deployed-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end }}
