{{- range .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-deployed-app.fullname" $ }}-{{ .name }}
  labels:
    {{- include "agent-deployed-app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .name }}
spec:
  replicas: {{ .replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "agent-deployed-app.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ .name }}
  template:
    metadata:
      labels:
        {{- include "agent-deployed-app.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ .name }}
        moses.ai/tenant-id: {{ $.Values.moses.tenantId | quote }}
        moses.ai/execution-id: {{ $.Values.moses.executionId | quote }}
        {{- if $.Values.moses.chartId }}
        moses.ai/chart-id: {{ $.Values.moses.chartId | quote }}
        {{- end }}
        {{- if $.Values.moses.appSlug }}
        moses.ai/app-slug: {{ $.Values.moses.appSlug | quote }}
        {{- end }}
        moses.ai/managed-by: moses
    spec:
      containers:
        - name: {{ .name }}
          {{- $imgSpec := dict "repository" "placeholder" "tag" "latest" "pullPolicy" "IfNotPresent" }}
          {{- if and $.Values.images (hasKey $.Values.images .name) }}
          {{- $imgSpec = index $.Values.images .name }}
          {{- else if .image }}
          {{- $imgSpec = .image }}
          {{- end }}
          image: "{{ $imgSpec.repository }}:{{ $imgSpec.tag }}"
          imagePullPolicy: {{ $imgSpec.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .port }}
              protocol: TCP
          {{- if $.Values.secrets }}
          envFrom:
            {{- if $.Values.secrets.secretName }}
            - secretRef:
                name: {{ $.Values.secrets.secretName }}
            {{- end }}
            {{- if $.Values.secrets.configMapName }}
            - configMapRef:
                name: {{ $.Values.secrets.configMapName }}
            {{- end }}
          {{- end }}
          env:
            {{- range $key, $value := $.Values.globalEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if eq .name "frontend" }}
            - name: BACKEND_SERVICE_HOST
              value: "{{ include "agent-deployed-app.fullname" $ }}-backend"
            - name: BACKEND_SERVICE_PORT
              value: "8080"
            {{- end }}
            {{- if $.Values.redis.enabled }}
            - name: REDIS_ADDR
              value: "{{ include "agent-deployed-app.fullname" $ }}-redis:{{ $.Values.redis.port }}"
            {{- end }}
            {{- range $key, $value := .env }}
            {{- if and (ne $key "BACKEND_SERVICE_HOST") (ne $key "BACKEND_SERVICE_PORT") (ne $key "REDIS_ADDR") }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          {{- if .healthCheck }}
          startupProbe:
            httpGet:
              path: {{ .healthCheck.path }}
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .healthCheck.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .healthCheck.path }}
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          {{- end }}
          resources:
            {{- toYaml .resources | nindent 12 }}
        {{- if .sidecars }}
        {{- range .sidecars }}
        - name: {{ .name }}
          image: "{{ .image }}"
          {{- if .ports }}
          ports:
            {{- range .ports }}
            - containerPort: {{ .containerPort }}
              protocol: {{ .protocol | default "TCP" }}
            {{- end }}
          {{- end }}
          {{- if .env }}
          env:
            {{- range $key, $value := .env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- if .resources }}
          resources:
            {{- toYaml .resources | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- end }}
{{- end }}
