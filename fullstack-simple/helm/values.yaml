moses:
  namespace: ""
  tenantId: ""
  executionId: ""
  chartId: ""
  appSlug: ""

# Image references (v2 format — used by deployment template)
# These are overridden by Moses during deployment via --set images.{name}.repository=...
images:
  frontend:
    repository: "fullstack-simple-frontend"
    tag: "latest"
    pullPolicy: IfNotPresent
  backend:
    repository: "fullstack-simple-backend"
    tag: "latest"
    pullPolicy: IfNotPresent

services:
  - name: frontend
    image:
      repository: "fullstack-simple-frontend"
      tag: "latest"
      pullPolicy: IfNotPresent
    port: 8080
    replicas: 1
    resources:
      limits:
        cpu: "200m"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
    healthCheck:
      enabled: true
      path: /health
    ingress: true

  - name: backend
    image:
      repository: "fullstack-simple-backend"
      tag: "latest"
      pullPolicy: IfNotPresent
    port: 8080
    replicas: 1
    resources:
      limits:
        cpu: "200m"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
    healthCheck:
      enabled: true
      path: /health

globalEnv:
  BASE_URL: ""
  NODE_ENV: "production"

# Optional Redis sidecar — set enabled: true to include a Redis instance.
# REDIS_ADDR is auto-injected into all service containers using the fullname helper.
# Agents should NEVER hardcode Redis service names — they are dynamic.
redis:
  enabled: false
  image: "redis:7-alpine"
  port: 6379
  resources:
    limits:
      cpu: "100m"
      memory: "128Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"
