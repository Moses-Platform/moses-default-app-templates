user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    gzip on;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # CHAT-pbup: emit Content-Security-Policy: frame-ancestors based on
        # the embedding policy resolved by entrypoint.sh from
        # MOSES_EMBEDDING_FRAMING / MOSES_EMBEDDING_ALLOWED_ANCESTORS.
        # The legacy unconditional `X-Frame-Options: SAMEORIGIN` is gone —
        # the policy is rendered explicitly here.
        add_header Content-Security-Policy "frame-ancestors ${MOSES_CSP_FRAME_ANCESTORS}; ${MOSES_CSP_REPORT_URI}" always;
        ${MOSES_X_FRAME_OPTIONS_LINE}
        add_header X-Content-Type-Options "nosniff" always;

        # Health check stays at root regardless of MOSES_BASE_PATH (K8s probes
        # bypass ingress per the moses-deployment-guide skill).
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # MOSES ROUTING MODEL:
        # Browser -> /apps/workspace/app-slug/api/... -> app ingress.
        # Moses-aware templates: the app already serves under the BASE_PATH,
        #   so /api/ here is reached as ${MOSES_BASE_PATH}api/. Nginx still
        #   matches /api/ at the root because Vite-built relative URLs in
        #   index.html resolve against the page URL.
        # Frontend JS MUST use relative paths: fetch('api/...') NOT fetch('/api/...').
        # Absolute paths bypass this proxy entirely and hit the Moses platform backend.
        location /api/ {
            proxy_pass http://${BACKEND_SERVICE_HOST}:${BACKEND_SERVICE_PORT}/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass_header X-Moses-Tenant-ID;
            proxy_pass_header X-Moses-User-ID;
            proxy_pass_header X-Moses-Chart-ID;
            proxy_pass_header X-Moses-Request-ID;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # CHAT-pbup Bugs 2 + 4: when MOSES_BASE_PATH is non-root, this block
        # adds /apps/<tenant>/<slug>/api/ proxy_pass + a rewrite-then-relocate
        # for the SPA path. Empty when MOSES_BASE_PATH=/.
        ${MOSES_SUBPATH_LOCATION_BLOCK}

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
