user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    gzip on;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # CHAT-pbup: emit Content-Security-Policy: frame-ancestors based on
        # the embedding policy resolved by entrypoint.sh from
        # MOSES_EMBEDDING_FRAMING / MOSES_EMBEDDING_ALLOWED_ANCESTORS.
        # The legacy unconditional `X-Frame-Options: SAMEORIGIN` is gone —
        # the policy is rendered explicitly here.
        add_header Content-Security-Policy "frame-ancestors ${MOSES_CSP_FRAME_ANCESTORS}; ${MOSES_CSP_REPORT_URI}" always;
        ${MOSES_X_FRAME_OPTIONS_LINE}
        add_header X-Content-Type-Options "nosniff" always;

        # Health check stays at root regardless of MOSES_BASE_PATH (K8s probes
        # bypass ingress per the moses-deployment-guide skill).
        location /health {
            access_log off;
            # default_type (not add_header Content-Type) so exactly one
            # Content-Type header is emitted for the literal return body.
            default_type text/plain;
            # nginx add_header inheritance is all-or-nothing: declaring any
            # add_header in this block drops the server-level set, so
            # re-declare nosniff here.
            add_header X-Content-Type-Options "nosniff" always;
            return 200 "healthy\n";
        }

        # MOSES ROUTING MODEL:
        # Browser -> /apps/workspace/app-slug/api/... -> app ingress.
        # Moses-aware templates: the app already serves under the BASE_PATH,
        #   so /api/ here is reached as ${MOSES_BASE_PATH}api/. Nginx still
        #   matches /api/ at the root because Vite-built relative URLs in
        #   index.html resolve against the page URL.
        # Frontend JS MUST use relative paths: fetch('api/...') NOT fetch('/api/...').
        # Absolute paths bypass this proxy entirely and hit the Moses platform backend.
        # CHAT-t5d1u.24: apex/custom-hostname traffic arrives root-relative
        # (the platform serves custom hostnames at the host root with NO
        # rewrite) while the backend mounts the API ONCE under
        # MOSES_BASE_PATH (README § deployed-app path contract), so this
        # root block forwards onto ${MOSES_BASE_PATH_PREFIX}/api/. When the
        # prefix is empty (standalone, MOSES_BASE_PATH=/) the rendered line
        # is byte-identical to the plain /api/ pass-through.
        location /api/ {
            proxy_pass http://${BACKEND_SERVICE_HOST}:${BACKEND_SERVICE_PORT}${MOSES_BASE_PATH_PREFIX}/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CHAT-pxeo.12: the X-Moses-* REQUEST headers (Tenant/User/Chart/
            # Request-ID) reach the backend via nginx's default behaviour —
            # proxy_pass forwards all inbound request headers except
            # hop-by-hop ones. No directive is needed (and proxy_pass_header
            # would be a no-op here: it controls upstream RESPONSE headers).
            # The backend reads MOSES_TENANT_ID from env for storage keys;
            # the forwarded header only drives the 403 cross-check on writes.
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            # Re-declare nosniff: a local add_header drops the inherited
            # server-level set (all-or-nothing inheritance).
            add_header X-Content-Type-Options "nosniff" always;
        }

        # CHAT-pbup Bugs 2 + 4: when MOSES_BASE_PATH is non-root, this block
        # adds /apps/<tenant>/<slug>/api/ proxy_pass + a rewrite-then-relocate
        # for the SPA path. Empty when MOSES_BASE_PATH=/.
        ${MOSES_SUBPATH_LOCATION_BLOCK}

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
