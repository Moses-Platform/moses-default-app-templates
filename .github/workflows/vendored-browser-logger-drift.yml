name: Vendored browser-logger drift check
on:
  pull_request:
    paths:
      - 'shared/browser-logger/**'
      - '**/moses-browser-logger.ts'
      - 'tools/check-vendored-browser-logger.sh'
  push:
    branches: [main]
    paths:
      - 'shared/browser-logger/**'
      - '**/moses-browser-logger.ts'
      - 'tools/check-vendored-browser-logger.sh'
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: ./tools/check-vendored-browser-logger.sh
