name: Vendored base-path drift check
on:
  pull_request:
    paths:
      - 'shared/base-path/**'
      - '**/src/utils/baseUrl.ts'
      - 'tools/check-vendored-base-path.sh'
  push:
    branches: [main]
    paths:
      - 'shared/base-path/**'
      - '**/src/utils/baseUrl.ts'
      - 'tools/check-vendored-base-path.sh'
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: ./tools/check-vendored-base-path.sh
