name: Vendored csrf-go drift check
on:
  pull_request:
    paths:
      - 'shared/csrf-go/**'
      - '**/csrf.go'
      - '**/csrf_test.go'
      - 'tools/check-vendored-csrf.sh'
  push:
    branches: [main]
    paths:
      - 'shared/csrf-go/**'
      - '**/csrf.go'
      - '**/csrf_test.go'
      - 'tools/check-vendored-csrf.sh'
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: ./tools/check-vendored-csrf.sh
