moses:
  namespace: ""
  tenantId: ""
  executionId: ""
  chartId: ""
  appSlug: ""

# Image references (v2 format — used by deployment template)
# These are overridden by Moses during deployment via --set images.{name}.repository=...
images:
  app:
    repository: "fullstack-unified-app"
    tag: "latest"
    pullPolicy: IfNotPresent

services:
  - name: app
    image:
      repository: "fullstack-unified-app"
      tag: "latest"
      pullPolicy: IfNotPresent
    port: 8080
    replicas: 1
    resources:
      limits:
        cpu: "200m"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
    healthCheck:
      enabled: true
      path: /health
    ingress: true

globalEnv:
  BASE_URL: ""
