moses:
  namespace: ""
  tenantId: ""
  executionId: ""
  chartId: ""
  appSlug: ""
  # CHAT-pbup: Moses-aware template values. See ../README.md / DEPRECATIONS.md.
  basePath: "/"
  embedding:
    framing: ""           # empty -> appType default (hybrid: moses-only)
    allowedAncestors: []
    reportUri: ""
  # OIDC relying-party config is NOT a chart value. The Moses platform
  # registers a confidential Keycloak client for the app and delivers every
  # MOSES_OIDC_* value (issuer, internal issuer, client id/secret, audience,
  # protected/public paths and the session-cookie key MOSES_OIDC_COOKIE_SECRET)
  # in a Kubernetes Secret whose name it appends to `secrets.secretNames` (see
  # the `secrets` block below). The deployment template mounts it via
  # `envFrom` and must not emit any of those keys as explicit `env` entries:
  # an explicit `env` overrides `envFrom` and would shadow the platform value.
  #
  # Standalone `helm install` without the platform Secret leaves the
  # MOSES_OIDC_* env vars empty; the vendored oidcauth middleware then runs in
  # pass-through mode (public routes + the X-Moses-* header path still work,
  # browser requests are NOT redirected).

# Platform-injected secrets / config maps.
#
# CHAT-t5d1u.28.20 (B2): the Moses platform delivers app secrets — including
# the OIDC Secret described in the moses block above — by creating a Kubernetes
# Secret and appending its name to the indexed list `secrets.secretNames`
# (provisionPlatformAPISecretIntoValues / provisionAppOIDCIntoValues). The
# deployment template mounts every entry as an `envFrom: secretRef`, so the
# Secret's keys become container env vars.
#
# `secretName` (singular) and `configMapName` are retained for backward
# compatibility — older injection paths and standalone overrides may use them.
#
# Standalone `helm install` (no platform injection) leaves secretNames empty;
# the `envFrom` range then renders nothing and oidcauth pass-through mode
# (the correct standalone behavior) applies.
secrets:
  secretName: ""        # legacy single-secret name (backward compatible)
  secretNames: []       # platform-injected list of Secret names (mounted via envFrom)
  configMapName: ""     # optional config map mounted via envFrom

# Image references (v2 format — used by deployment template)
# These are overridden by Moses during deployment via --set images.{name}.repository=...
images:
  frontend:
    repository: "fullstack-oidc-frontend"
    tag: "latest"
    pullPolicy: IfNotPresent
  backend:
    repository: "fullstack-oidc-backend"
    tag: "latest"
    pullPolicy: IfNotPresent

services:
  - name: frontend
    podSecurityContext:
      runAsUser: 101
      runAsGroup: 101
      fsGroup: 101
    securityContext:
      runAsUser: 101
      runAsGroup: 101
    image:
      repository: "fullstack-oidc-frontend"
      tag: "latest"
      pullPolicy: IfNotPresent
    port: 8080
    replicas: 1
    resources:
      limits:
        cpu: "200m"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
    healthCheck:
      enabled: true
      path: /health
    ingress: true

  - name: backend
    image:
      repository: "fullstack-oidc-backend"
      tag: "latest"
      pullPolicy: IfNotPresent
    port: 8080
    replicas: 1
    # Keep in lockstep with moses-app.config.json services.backend.resources
    # — the platform reads the config; these values apply on standalone
    # `helm install`.
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
    healthCheck:
      enabled: true
      path: /health

globalEnv:
  # Shared nginx / Go request-body cap in bytes; change this one value.
  MOSES_MAX_BODY_BYTES: "1048576"
  # CHAT-pbup: BASE_URL deprecated alias, MOSES_BASE_PATH canonical.
  BASE_URL: ""
  MOSES_BASE_PATH: ""
  NODE_ENV: "production"
  MOSES_EMBEDDING_FRAMING: ""
  MOSES_EMBEDDING_ALLOWED_ANCESTORS: ""
  MOSES_EMBEDDING_REPORT_URI: ""

postgresql:
  automountServiceAccountToken: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
    readOnlyRootFilesystem: true
  enabled: true
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  auth:
    # CHAT-59o2 (DEPS-B2): align with platform convention. Moses' provisioner
    # (agent_helm_provisioner.go BuildDeployValuesWithEmbedding around line
    # 443-444) injects postgresql.auth.username="app" / database="appdb" by
    # default. Earlier values had username/database="showcase" which collided
    # with the platform override and produced 14 retries with
    # `password authentication failed for user "app"` before postgres
    # finally created the role as a side effect. Aligning here makes the
    # backend connect on attempt 1.
    username: app
    # Precreated Secret in the release namespace; Moses supplies this reference.
    existingSecret: ""
    passwordKey: "password"
    database: appdb
  resources:
    limits:
      cpu: "200m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"

# Runtime defaults. Service/sidecar securityContext maps can override these.
automountServiceAccountToken: false
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault
  readOnlyRootFilesystem: true
