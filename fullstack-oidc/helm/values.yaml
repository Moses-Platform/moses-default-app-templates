moses:
  namespace: ""
  tenantId: ""
  executionId: ""
  chartId: ""
  appSlug: ""
  # CHAT-pbup: Moses-aware template values. See ../README.md / DEPRECATIONS.md.
  basePath: "/"
  embedding:
    framing: ""           # empty -> appType default (hybrid: moses-only)
    allowedAncestors: []
    reportUri: ""
  # CHAT-t5d1u.28.8 / .28.20: OIDC relying-party config.
  #
  # IMPORTANT — the five MOSES_OIDC_* values (issuer, internalIssuer,
  # clientId, clientSecret, audience) are NOT delivered through these
  # moses.oidc.* Helm values. The Moses platform (ticket 28.5) registers
  # a confidential Keycloak client for the app and delivers those five
  # values exactly one way: a Kubernetes Secret whose name it appends to
  # `secrets.secretNames` (see the `secrets` block below). The chart
  # mounts that Secret via `envFrom`, so MOSES_OIDC_ISSUER,
  # MOSES_OIDC_INTERNAL_ISSUER, MOSES_OIDC_CLIENT_ID, MOSES_OIDC_AUDIENCE
  # and MOSES_OIDC_CLIENT_SECRET reach the backend container as env vars.
  # The moses.oidc issuer/internalIssuer/clientId/clientSecret/audience
  # fields below are therefore vestigial placeholders kept only so a
  # standalone operator can wire OIDC by hand if desired — the platform
  # never sets them.
  #
  # The remaining fields (protectedPaths, publicPaths, cookieSecret) are
  # genuinely chart-provided: they are NOT in the platform Secret and the
  # deployment template renders them into env (MOSES_OIDC_PROTECTED_PATHS,
  # MOSES_OIDC_PUBLIC_PATHS, MOSES_OIDC_COOKIE_SECRET).
  #
  # Standalone `helm install` without the platform Secret leaves the five
  # MOSES_OIDC_* env vars empty; the vendored oidcauth middleware then
  # runs in pass-through mode (public routes + the X-Moses-* header path
  # still work, browser requests are NOT redirected).
  oidc:
    issuer: ""           # external issuer URL — platform delivers via Secret, not here
    internalIssuer: ""   # in-cluster issuer URL — platform delivers via Secret, not here
    clientId: ""         # confidential client id — platform delivers via Secret, not here
    clientSecret: ""     # confidential client secret — platform delivers via Secret, not here
    audience: ""         # expected `aud` — platform delivers via Secret, not here
    # Path prefixes (space- or comma-separated) from the app's
    # access.oidc block. protectedPaths empty => protect-all.
    # /health and /api/openapi.json are ALWAYS public implicitly — the
    # vendored oidcauth middleware adds them to its public set, so they
    # are not listed here. These ARE chart-provided (not in the Secret).
    protectedPaths: "/api/v1/me /api/v1/entries /api/v1/admin-area"
    publicPaths: "/api/v1/public-info"
    # cookieSecret keys the session cookie HMAC. Chart-provided (NOT in
    # the platform Secret); the platform may inject a per-deploy random
    # value via --set, empty => the middleware derives a process-local
    # fallback (sessions reset on pod restart — fail-safe).
    cookieSecret: ""

# Platform-injected secrets / config maps.
#
# CHAT-t5d1u.28.20 (B2): the Moses platform delivers app secrets — including
# the OIDC Secret described under moses.oidc above — by creating a Kubernetes
# Secret and appending its name to the indexed list `secrets.secretNames`
# (provisionPlatformAPISecretIntoValues / provisionAppOIDCIntoValues). The
# deployment template mounts every entry as an `envFrom: secretRef`, so the
# Secret's keys become container env vars.
#
# `secretName` (singular) and `configMapName` are retained for backward
# compatibility — older injection paths and standalone overrides may use them.
#
# Standalone `helm install` (no platform injection) leaves secretNames empty;
# the `envFrom` range then renders nothing and oidcauth pass-through mode
# (the correct standalone behavior) applies.
secrets:
  secretName: ""        # legacy single-secret name (backward compatible)
  secretNames: []       # platform-injected list of Secret names (mounted via envFrom)
  configMapName: ""     # optional config map mounted via envFrom

# Image references (v2 format — used by deployment template)
# These are overridden by Moses during deployment via --set images.{name}.repository=...
images:
  frontend:
    repository: "fullstack-oidc-frontend"
    tag: "latest"
    pullPolicy: IfNotPresent
  backend:
    repository: "fullstack-oidc-backend"
    tag: "latest"
    pullPolicy: IfNotPresent

services:
  - name: frontend
    image:
      repository: "fullstack-oidc-frontend"
      tag: "latest"
      pullPolicy: IfNotPresent
    port: 8080
    replicas: 1
    resources:
      limits:
        cpu: "200m"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
    healthCheck:
      enabled: true
      path: /health
    ingress: true

  - name: backend
    image:
      repository: "fullstack-oidc-backend"
      tag: "latest"
      pullPolicy: IfNotPresent
    port: 8080
    replicas: 1
    resources:
      limits:
        cpu: "200m"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
    healthCheck:
      enabled: true
      path: /health

globalEnv:
  # CHAT-pbup: BASE_URL deprecated alias, MOSES_BASE_PATH canonical.
  BASE_URL: ""
  MOSES_BASE_PATH: ""
  NODE_ENV: "production"
  MOSES_EMBEDDING_FRAMING: ""
  MOSES_EMBEDDING_ALLOWED_ANCESTORS: ""
  MOSES_EMBEDDING_REPORT_URI: ""

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  auth:
    # CHAT-59o2 (DEPS-B2): align with platform convention. Moses' provisioner
    # (agent_helm_provisioner.go BuildDeployValuesWithEmbedding around line
    # 443-444) injects postgresql.auth.username="app" / database="appdb" by
    # default. Earlier values had username/database="showcase" which collided
    # with the platform override and produced 14 retries with
    # `password authentication failed for user "app"` before postgres
    # finally created the role as a side effect. Aligning here makes the
    # backend connect on attempt 1.
    username: app
    # __MOSES_GENERATE_PASSWORD__ is a sentinel the Moses platform's
    # SanitizeTemplateCredentials replaces with a per-tenant random 24-char
    # password during template injection (see moses-platform-prep/backend/
    # internal/services/agent_blueprint_provisioner.go).
    #
    # When deploying this chart standalone (without Moses), override via:
    #   helm install <release> . --set postgresql.auth.password=$(openssl rand -hex 24)
    # NEVER ship this literal value to production — it is a placeholder.
    password: __MOSES_GENERATE_PASSWORD__
    database: appdb
  resources:
    limits:
      cpu: "200m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
