{{- /*
CHAT-t5d1u.28.8 / .28.21: Secret holding the session-cookie HMAC key
consumed by the vendored oidcauth middleware. Keeping it in a Secret
(not plaintext env in the Deployment manifest) is the security baseline.

CHAT-t5d1u.28.21 (C1): the confidential OIDC client secret
(MOSES_OIDC_CLIENT_SECRET) is NO LONGER stored here. The Moses platform
delivers it — together with the other four MOSES_OIDC_* values — via the
platform-managed Secret listed in secrets.secretNames[]. This chart
Secret therefore only carries the cookie HMAC key.

CHAT-t5d1u.28.21 (S1): cookie-secret MUST be stable across `helm
upgrade`. randAlphaNum is re-evaluated on every render, so generating it
unconditionally would rotate the HMAC key on each deploy and invalidate
every live session. The `lookup` idiom below reuses the Secret's
existing cookie-secret value when the Secret already exists in the
cluster; a fresh value is generated ONLY on first install. (`lookup`
returns an empty map during `helm template`/`--dry-run`, so a fresh
value is rendered there — that is expected and harmless.)

The Moses platform may also inject a per-deploy cookie value via
`--set moses.oidc.cookieSecret=...`; when set, it wins.
*/ -}}
{{- $secretName := printf "%s-oidc" (include "agent-deployed-app.fullname" .) -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
{{- $cookieSecret := "" -}}
{{- if .Values.moses.oidc.cookieSecret -}}
  {{- $cookieSecret = .Values.moses.oidc.cookieSecret | b64enc -}}
{{- else if and $existing $existing.data (index $existing.data "cookie-secret") -}}
  {{- $cookieSecret = index $existing.data "cookie-secret" -}}
{{- else -}}
  {{- $cookieSecret = randAlphaNum 32 | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "agent-deployed-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: oidc
type: Opaque
data:
  cookie-secret: {{ $cookieSecret | quote }}
