{{- /*
CHAT-t5d1u.28.8: Secret holding the two sensitive OIDC values consumed
by the vendored oidcauth middleware — the confidential client secret and
the session-cookie HMAC key. Keeping them in a Secret (not plaintext env
in the Deployment manifest) is the security baseline.

The Moses platform populates moses.oidc.clientSecret / cookieSecret at
deploy time. For a standalone `helm install` with neither set:
  - client-secret stays empty -> oidcauth runs in pass-through mode
    (Config.Enabled() == false), which is the correct, safe default.
  - cookie-secret is generated once via randAlphaNum so a standalone
    deploy still gets a stable per-release HMAC key.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-deployed-app.fullname" . }}-oidc
  labels:
    {{- include "agent-deployed-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: oidc
type: Opaque
data:
  client-secret: {{ .Values.moses.oidc.clientSecret | default "" | b64enc | quote }}
  cookie-secret: {{ .Values.moses.oidc.cookieSecret | default (randAlphaNum 32) | b64enc | quote }}
