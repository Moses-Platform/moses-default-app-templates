{{- if .Values.postgresql }}
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-deployed-app.fullname" . }}-postgresql
  labels:
    {{- include "agent-deployed-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
data:
  postgresql-password: {{ .Values.postgresql.auth.password | b64enc | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-deployed-app.fullname" . }}-postgresql
  labels:
    {{- include "agent-deployed-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agent-deployed-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "agent-deployed-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository | default "postgres" }}:{{ .Values.postgresql.image.tag | default "17-alpine" }}"
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | default "app" | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-deployed-app.fullname" . }}-postgresql
                  key: postgresql-password
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | default "appdb" | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # pg_isready needs both -U (user) AND -d (database). Without -d,
          # the probe connects to a db that defaults to the user name ("app"),
          # which does not exist (we created "appdb"), and the postgres server
          # log fills with `FATAL: database "app" does not exist` on every
          # probe tick. pg_isready still exits 0 because the server responded,
          # so the probe passes — but the log noise hides real failures.
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.auth.username | default "app" | quote }}
                - -d
                - {{ .Values.postgresql.auth.database | default "appdb" | quote }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.auth.username | default "app" | quote }}
                - -d
                - {{ .Values.postgresql.auth.database | default "appdb" | quote }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-deployed-app.fullname" . }}-postgresql
  labels:
    {{- include "agent-deployed-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  selector:
    {{- include "agent-deployed-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
{{- end }}
